name: Bug report
description: Report a reproducible problem without sensitive telemetry.
body:
  - type: markdown
    attributes: {value: "Do not include credentials, prompts, responses, or private telemetry."}
  - type: textarea
    id: behavior
    attributes: {label: Observed behavior}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Commit or version}
    validations: {required: true}
