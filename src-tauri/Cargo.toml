[package]
name = "ai-optimization-tool"
version = "0.12.0"
description = "Local-first AI usage optimization desktop application"
authors = ["AI Optimization Tool contributors"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
